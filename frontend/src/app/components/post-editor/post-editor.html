<!-- Overlay -->
<div style="position: fixed; inset: 0; background-color: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px;">

  <!-- Modal -->
  <div style="background-color: #F5F0E8; border-radius: 12px; width: 100%; max-width: 860px; display: flex; flex-direction: column; box-shadow: 0 24px 64px rgba(0,0,0,0.3);"
       [style.height]="isMinimized() ? 'auto' : '90vh'">

    <!-- Barra superior -->
    <div style="background-color: #2D5016; border-radius: 12px 12px 0 0; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span class="material-icons" style="color: #E8891A; font-size: 20px;">edit_note</span>
        <span style="font-family: 'Playfair Display', serif; font-size: 1rem; color: #F5F0E8;">
          {{ titulo || 'Novo texto' }}
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">

        <!-- Salvar rascunho -->
        <button (click)="saveAsDraft()" title="Salvar rascunho"
                style="display: flex; align-items: center; gap: 6px; padding: 6px 14px; background-color: transparent; color: #F5F0E8; font-family: 'Inter', sans-serif; font-size: 12px; border: 1px solid rgba(245,240,232,0.3); border-radius: 6px; cursor: pointer;">
          <span class="material-icons" style="font-size: 16px;">save</span>
          {{ isSaved() ? 'Salvo!' : 'Rascunho' }}
        </button>

        <!-- Publicar -->
        <button (click)="onPublish()"
                style="display: flex; align-items: center; gap: 6px; padding: 6px 14px; background-color: #E8395A; color: #F5F0E8; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; border: none; border-radius: 6px; cursor: pointer;">
          <span class="material-icons" style="font-size: 16px;">send</span>
          Publicar
        </button>

        <!-- Minimizar -->
        <button (click)="toggleMinimize()" title="Minimizar"
                style="background: none; border: none; color: #F5F0E8; cursor: pointer; opacity: 0.7; padding: 4px;">
          <span class="material-icons" style="font-size: 20px;">{{ isMinimized() ? 'expand_less' : 'remove' }}</span>
        </button>

        <!-- Fechar -->
        <button (click)="onClose()" title="Fechar"
                style="background: none; border: none; color: #F5F0E8; cursor: pointer; opacity: 0.7; padding: 4px;">
          <span class="material-icons" style="font-size: 20px;">close</span>
        </button>

      </div>
    </div>

    <!-- Conteúdo do editor -->
    @if (!isMinimized()) {
      <div style="display: flex; flex-direction: column; flex: 1; overflow: hidden; padding: 24px; gap: 16px;">

        <!-- Título -->
        <input type="text" [(ngModel)]="titulo" placeholder="Título do seu texto..."
               style="width: 100%; padding: 12px 0; font-family: 'Playfair Display', serif; font-size: 1.6rem; color: #1A1A1A; background: transparent; border: none; border-bottom: 2px solid rgba(74,124,47,0.3); outline: none; box-sizing: border-box;" />

        <!-- Config: tag + anônimo -->
        <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">

          <select [(ngModel)]="selectedTag"
                  style="padding: 8px 14px; border: 1.5px solid #4A7C2F; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13px; color: #2D5016; background: #fff; outline: none;">
            <option value="">Selecione uma categoria</option>
            @for (tag of tags; track tag) {
              <option [value]="tag">{{ tag }}</option>
            }
          </select>

          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; color: #2D5016;">
            <input type="checkbox" [(ngModel)]="anonimo"
                   style="width: 16px; height: 16px; accent-color: #2D5016; cursor: pointer;" />
            Publicar anonimamente
          </label>

          @if (isSaved()) {
            <span style="font-family: 'Inter', sans-serif; font-size: 12px; color: #1D9E75; display: flex; align-items: center; gap: 4px;">
              <span class="material-icons" style="font-size: 14px;">check_circle</span>
              Rascunho salvo
            </span>
          }

        </div>

        <!-- Editor Quill -->
        <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; border: 1.5px solid rgba(74,124,47,0.3); border-radius: 8px; background: #fff;">
          <div id="editor" style="flex: 1; font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; overflow-y: auto;"></div>
        </div>

      </div>
    }

  </div>
</div>
